<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fafaf8"/>
    <stop offset="1" stop-color="#efefec"/>
  </linearGradient>
  <radialGradient id="moon" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#e1e1de"/>
    <stop offset=".74" stop-color="#ebebe8"/>
    <stop offset="1" stop-color="#f6f6f3" stop-opacity="0"/>
  </radialGradient>
  <filter id="mist"><feGaussianBlur stdDeviation="22"/></filter>
</defs>

<!-- atmospheric geometry -->
<circle cx="1165" cy="205" r="250" fill="url(#moon)"/>
<circle cx="1165" cy="205" r="190" fill="none" stroke="#d1d1ce" stroke-width="1.4"/>

<path d="M0 414 L150 352 L268 392 L394 310 L510 388 L650 326 L806 400 L956 291 L1080 370 L1222 255 L1354 356 L1490 306 L1600 360 L1600 560 L0 560 Z"
