</style>

<text class="m" x="32" y="30"><tspan class="sig">03</tspan> / selected work</text>
<text class="m dim" x="848" y="30" text-anchor="end">each row opens its repository</text>
<line class="hair" x1="32" x2="848" y1="44.5" y2="44.5"/><text class="d" x="32" y="92" font-size="36">EACH ON ITS OWN HARDWARE.</text>
