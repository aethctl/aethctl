<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 112" width="880" height="112" role="img" aria-label="Selected work, each on its own hardware.">
<title>Selected work, each on its own hardware.</title>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#e9e5db}
.d{font-family:'Arial Narrow','Roboto Condensed',Arial,sans-serif;font-weight:900;fill:#e9e5db}
.dim{fill-opacity:.5}.mid{fill-opacity:.72}.sig{fill:#ff4d4d}.hair{stroke:rgba(233,229,219,.16);stroke-width:1}
.ln{fill:none;stroke:#e9e5db;stroke-opacity:.5}.fill{fill:#e9e5db}.ar{fill:none;stroke:#ff4d4d;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

